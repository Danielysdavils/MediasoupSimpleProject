syntax = "proto3";

package sessions;

import "google/protobuf/timestamp.proto";

message Sessao {
    // nome da sessao
    string name = 2;

    // criador da sessão 
    string creator = 3;

    // data de inico da sessao
    string startDateTime = 4;

    // data de fim da sessão
    string endDateTime = 5;

    // lista de caminhos completos dos arquivos. 
    // (!) Considera fileOrder
    repeated MediaFile files = 6;
}

message MediaFile {
    // Caminho efetivo que o headless deve reproduzir.
    // Pode apontar para original/* ou prepared/*.
    string path = 1;

    // Nome original do arquivo, útil para logs/debug.
    string originalName = 2;

    // Estratégia que o headless deve usar.
    PlaybackMode playbackMode = 3;
}

enum PlaybackMode {
    PLAYBACK_MODE_UNSPECIFIED = 0;
    COPY_PREPARED = 1;
    TRANSCODE_REALTIME = 2;
}

message SessionEvent {
    string id  = 1; // id da sessão
    int64 version = 2; // evita race condition

    oneof payload {
        SessionCreated created = 10;
        SessionUpdated updated = 11; // pode alterar data de inicio/fim ou arquivos
        SessionDeleted deleted = 14;
    }
}

message SessionCreated {
    Sessao full = 1;
}

message SessionUpdated {
    Sessao full = 1;
}

message SessionDeleted {}


// resposta do headless para c# (serverrun)
message Ack {
    string id = 1;
    bool accepted = 2;
    string reason = 3;
}

service SessionService {
    // Duplex streaming: cliente (c#) envia Sessao, servidor (Node) pode enviar Ack/controle
    rpc StreamSessions(stream SessionEvent) returns (stream Ack);
}